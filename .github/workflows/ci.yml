name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: algol26-interpreter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install z3-solver
        run: python -m pip install z3-solver

      - name: Integration suite (normal + --smt + --verify gates)
        run: python run_suite.py
